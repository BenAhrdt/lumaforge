<!doctype html>
<html lang="de" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LumaForge</title><script>document.documentElement.dataset.theme=localStorage.getItem('lumaforge.theme')||'light'</script><link rel="icon" href="logo.svg" type="image/svg+xml"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="snap.css"><link rel="stylesheet" href="color-mode.css"><link rel="stylesheet" href="theme.css"></head>
<body>
<header><div class="brand"><img class="logo" src="logo.svg" alt="LumaForge"><div><b>LumaForge</b><small>VISUAL LED STUDIO · <span id="version-metric">v0.2.0-alpha.6</span></small></div></div><div class="header-actions"><span id="system-metrics" title="Systemauslastung"><span id="cpu-metric">CPU —</span><span id="memory-metric">RAM —</span><span id="flash-metric">FLASH —</span></span><select id="language" aria-label="Language"><option value="de">Deutsch</option><option value="en">English</option></select><button id="theme-toggle" type="button"></button><button id="undo" data-i18n-title="undo">↶</button><button id="redo" data-i18n-title="redo">↷</button><button id="export" data-i18n="export"></button><label class="button"><span data-i18n="import"></span><input id="import" type="file" accept="application/json" hidden></label><span id="connection"><i></i><span data-i18n="connecting"></span></span></div></header>
<main>
  <aside class="left">
    <nav><button class="nav active" data-view="layout">⌁<span data-i18n="layout"></span></button><button class="nav" data-view="zones">⬡<span data-i18n="zones"></span></button><button class="nav" data-view="scenes">▷<span data-i18n="scenes"></span></button><button class="nav" data-view="automations">⏱<span data-i18n="automations"></span></button><button class="nav" data-view="settings">⚙<span data-i18n="settings"></span></button></nav>
    <section class="library"><div class="eyebrow" data-i18n="tools"></div><button class="tool active" data-tool="select">↖ <span data-i18n="selectLeds"></span><kbd>V</kbd></button><button class="tool" data-tool="draw">╱ <span></span><kbd>L</kbd></button><div class="eyebrow" data-i18n="runs"></div><div id="strip-list"></div><button id="new-strip" class="wide" data-i18n="newRun"></button><div class="eyebrow" data-i18n="zonesTitle"></div><div id="zone-list"></div></section>
  </aside>
  <section class="workspace">
    <div class="canvasbar"><div><b id="view-title" data-i18n="layoutCanvas"></b><span id="canvas-meta"></span></div><div class="canvas-actions"><button id="fit" data-i18n="fit"></button><button id="clear-selection" data-i18n="clearSelection"></button></div></div>
    <div id="canvas-wrap"><svg id="canvas" viewBox="0 0 1000 620"><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect id="grid-surface" x="0" y="0" width="1000" height="620" fill="url(#grid)"/><g id="round-grid"><circle r="120"/><circle r="240"/><circle r="360"/><circle r="480"/><circle r="600"/><circle r="720"/><circle r="840"/><circle r="960"/><circle r="1080"/><circle r="1200"/></g><g id="drawing"></g><rect id="selection-box" hidden/><line id="draft" hidden/><circle id="snap-marker" hidden r="10"/></svg><div class="hint" data-i18n="hint"></div></div>
    <section class="timeline"><div class="timeline-head"><div><b data-i18n="sceneTimeline"></b><select id="scene-select"></select></div><div class="timeline-actions"><button id="play-current-scene" class="primary" data-i18n="playScene" hidden></button><button id="stop-scene" data-i18n="stop" hidden></button><button id="edit-current-scene" data-i18n="editScene" hidden></button><button id="add-scene" data-i18n="addScene"></button></div></div><div id="timeline-ruler"></div><div id="timeline-tracks" class="empty"></div></section>
  </section>
  <aside class="properties"><div class="properties-title"><span data-i18n="properties"></span><span id="selection-count"></span></div><section id="selection-panel"><label><span data-i18n="color"></span><input id="color" type="color" value="#00aeef"></label><label><span data-i18n="brightness"></span> <output id="brightness-value">80%</output><input id="brightness" type="range" min="0" max="100" value="80"></label><label><span data-i18n="effect"></span><select id="effect"><option value="solid" data-i18n="solid"></option><option value="blink" data-i18n="blink"></option><option value="pulse" data-i18n="pulse"></option><option value="wipe" data-i18n="wipe"></option><option value="chase" data-i18n="chase"></option><option value="rainbow" data-i18n="rainbow"></option></select></label><label><span data-i18n="speed"></span> <output id="speed-value">1.0×</output><input id="speed" type="range" min="5" max="400" value="100"></label><label><span data-i18n="direction"></span><select id="direction"><option value="forward" data-i18n="forward"></option><option value="reverse" data-i18n="reverse"></option></select></label><div class="row"><button id="cancel-preview" data-i18n="cancel"></button><button id="apply-preview" class="primary" data-i18n="apply"></button></div><button id="create-zone" class="wide" data-i18n="saveZone"></button></section>
    <section id="strip-panel" hidden><label><span data-i18n="sectionName"></span><input id="strip-name"></label><label><span data-i18n="calculation"></span><select id="strip-sizing"><option value="length" data-i18n="lengthSizing"></option><option value="count" data-i18n="countSizing"></option></select></label><label><span data-i18n="physicalLength"></span><input id="strip-length" type="number" min="0.1" step="0.1"></label><label><span data-i18n="ledSpacing"></span><input id="strip-spacing" type="number" min="0.1" step="0.1"></label><label><span data-i18n="ledCount"></span><input id="strip-count" type="number" min="1" max="4096"></label><label><span data-i18n="firstIndex"></span><input id="strip-index" type="number" min="0" readonly></label><label><span data-i18n="outputRun"></span><input id="strip-output" readonly></label><label><span data-i18n="dataGpio"></span><select id="strip-gpio"></select></label><label class="check"><input id="strip-reverse" type="checkbox"><span data-i18n="reverseSection"></span></label><div class="row"><button id="delete-strip" class="danger" data-i18n="delete"></button><button id="save-strip" class="primary" data-i18n="saveSection"></button></div></section>
    <section id="zone-panel" hidden><h3 id="selected-zone-name"></h3><p id="selected-zone-count" class="muted"></p><button id="edit-selected-zone" class="wide primary" data-i18n="editZone"></button><button id="rename-selected-zone" class="wide" data-i18n="rename"></button><button id="delete-selected-zone" class="wide danger" data-i18n="delete"></button></section>
    <section id="settings-panel" hidden><h3 data-i18n="hardwareModel"></h3><div id="device-settings"></div><p class="muted" data-i18n="hardwareNote"></p></section>
  </aside>
</main><div id="toast"></div>
<dialog id="section-dialog"><form method="dialog"><h2 data-i18n="sectionDimensions"></h2><p class="muted" data-i18n="sectionDimensionsHint"></p><label><span data-i18n="physicalLength"></span><input id="dialog-length" type="number" min="0.1" step="0.1"></label><label><span data-i18n="ledCount"></span><input id="dialog-count" type="number" min="1" max="4096" step="1"></label><label><span data-i18n="ledSpacing"></span><input id="dialog-spacing" type="number" min="0.1" step="0.1" value="16.5"></label><div class="formula" id="dialog-formula"></div><div class="row"><button id="dialog-cancel" value="cancel" data-i18n="cancel"></button><button id="dialog-create" value="default" class="primary" data-i18n="createSection"></button></div></form></dialog>
<dialog id="manager-dialog"><div class="manager-head"><h2 id="manager-title"></h2><button id="manager-close" aria-label="Close">×</button></div><div id="manager-content"></div></dialog>
<dialog id="editor-dialog"><form id="editor-form"><div class="manager-head"><h2 id="editor-title"></h2><button type="button" id="editor-close" aria-label="Close">×</button></div><div id="editor-content"></div><div class="row"><button type="button" id="editor-cancel" data-i18n="cancel"></button><button class="primary" data-i18n="saveSection"></button></div></form></dialog>
<dialog id="app-dialog"><form method="dialog" autocomplete="off" data-bwignore="true" data-1p-ignore><div class="manager-head"><h2 id="app-dialog-title"></h2><button value="cancel" aria-label="Close">×</button></div><p id="app-dialog-message" class="muted"></p><label id="app-dialog-field"><span id="app-dialog-label"></span><input id="app-dialog-input" type="text" autocomplete="off" data-bwignore="true" data-1p-ignore><select id="app-dialog-select" hidden></select></label><div class="row"><button value="cancel" data-i18n="cancel"></button><button value="confirm" class="primary" data-i18n="apply"></button></div></form></dialog>
<dialog id="new-run-dialog"><form method="dialog" autocomplete="off"><div class="manager-head"><h2 data-i18n="newRun"></h2><button value="cancel" aria-label="Close">×</button></div><label><span data-i18n="dataGpio"></span><select id="new-run-gpio"></select></label><label><span data-i18n="stripColorOrder"></span><select id="new-run-color-order"><option>RGB</option><option>GRB</option><option>BRG</option><option>RBG</option><option>GBR</option><option>BGR</option></select></label><label><span data-i18n="outputName"></span><input id="new-run-name" required></label><div class="row"><button value="cancel" data-i18n="cancel"></button><button value="confirm" class="primary" data-i18n="apply"></button></div></form></dialog>
<script src="app.js"></script></body></html>
